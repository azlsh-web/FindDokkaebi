<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>플로우 사진 · 찾아라! 도깨비</title><link rel='stylesheet' href='../../style.css'></head><body><div class='wrap'><a class='back' href='../../index.html'>← 문서 목록</a><header class='top'><h1>플로우 사진</h1></header><p class='meta'>자동 플레이로 찍은 화면 158장이에요. 사진을 누르면 크게 보여요.</p><div class='shots'><h2>시작</h2><div class='row'><figure><a href='001.jpg'><img loading='lazy' src='001.jpg' alt='시작 화면'></a><figcaption>시작 화면</figcaption></figure><figure><a href='002.jpg'><img loading='lazy' src='002.jpg' alt='게임 시작하기 → 챕터 선택 : 소풍만 열려 있고 나머지는 준비 중'></a><figcaption>게임 시작하기 → 챕터 선택 : 소풍만 열려 있고 나머지는 준비 중</figcaption></figure></div><h2>1단계 방망이</h2><div class='row'><figure><a href='003.jpg'><img loading='lazy' src='003.jpg' alt='시작 대화 1'></a><figcaption>시작 대화 1<span class='l'>오늘 소풍 가는 날인데… 어? 내 가방이 어디 갔지?</span></figcaption></figure><figure><a href='004.jpg'><img loading='lazy' src='004.jpg' alt='시작 대화 2'></a><figcaption>시작 대화 2<span class='l'>돗자리도, 김밥도 없어! 또 깜빡하고 어디 뒀나 봐…</span></figcaption></figure><figure><a href='005.jpg'><img loading='lazy' src='005.jpg' alt='시작 대화 3'></a><figcaption>시작 대화 3<span class='l'>아! 쪽지에 그림을 그려서 간식이랑 같이 두면 도깨비가 찾아 준댔어!</span></figcaption></figure><figure><a href='006.jpg'><img loading='lazy' src='006.jpg' alt='시작 대화 4'></a><figcaption>시작 대화 4<span class='l'>도깨비야, 도깨비야! 어디 있니?</span></figcaption></figure><figure><a href='007.jpg'><img loading='lazy' src='007.jpg' alt='시작 대화 5'></a><figcaption>시작 대화 5<span class='l'>방금 누가 내 이름 불렀어?</span></figcaption></figure><figure><a href='008.jpg'><img loading='lazy' src='008.jpg' alt='시작 대화 6'></a><figcaption>시작 대화 6<span class='l'>와, 진짜 도깨비다! 내 소풍 준비물 좀 찾아 줘!</span></figcaption></figure><figure><a href='009.jpg'><img loading='lazy' src='009.jpg' alt='시작 대화 7'></a><figcaption>시작 대화 7<span class='l'>찾아 줄 수는 있지. 대신 달달한 간식을 줘야 해.</span></figcaption></figure><figure><a href='010.jpg'><img loading='lazy' src='010.jpg' alt='시작 대화 8'></a><figcaption>시작 대화 8<span class='l'>그런데 도깨비로서 좀 창피한 얘기지만… 나도 방망이를 잃어버렸거든.</span></figcaption></figure><figure><a href='011.jpg'><img loading='lazy' src='011.jpg' alt='시작 대화 9'></a><figcaption>시작 대화 9<span class='l'>방망이가 없으니까 영 힘이 안 나.</span></figcaption></figure><figure><a href='012.jpg'><img loading='lazy' src='012.jpg' alt='시작 대화 10'></a><figcaption>시작 대화 10<span class='l'>내 방망이부터 찾아 주면, 네 물건도 전부 찾아 줄게.</span></figcaption></figure><figure><a href='013.jpg'><img loading='lazy' src='013.jpg' alt='시작 대화 11'></a><figcaption>시작 대화 11<span class='l'>좋아! 어떻게 생겼는데? 내가 쪽지에 그려 줄게!</span></figcaption></figure><figure><a href='014.jpg'><img loading='lazy' src='014.jpg' alt='시작 대화 12'></a><figcaption>시작 대화 12<span class='l'>음… 머리가 굵고, 돌기가 나 있었어.</span></figcaption></figure><figure><a href='015.jpg'><img loading='lazy' src='015.jpg' alt='떠올리기 3초'></a><figcaption>떠올리기 3초</figcaption></figure><figure><a href='016.jpg'><img loading='lazy' src='016.jpg' alt='사탕 3개가 오른쪽에서 들어오고, 도깨비가 돋보기를 눌러 보라고 함'></a><figcaption>사탕 3개가 오른쪽에서 들어오고, 도깨비가 돋보기를 눌러 보라고 함<span class='l'>잘 기억 안 나지? 위에 있는 돋보기를 눌러 봐!</span></figcaption></figure><figure><a href='017.jpg'><img loading='lazy' src='017.jpg' alt='대사를 넘기면 : 대사가 사라지고 도깨비불이 돋보기 둘레를 돎'></a><figcaption>대사를 넘기면 : 대사가 사라지고 도깨비불이 돋보기 둘레를 돎</figcaption></figure><figure><a href='018.jpg'><img loading='lazy' src='018.jpg' alt='돋보기를 누르면 : 5초 동안, 렌즈를 끌어 보는 법을 알려 줌'></a><figcaption>돋보기를 누르면 : 5초 동안, 렌즈를 끌어 보는 법을 알려 줌<span class='l'>돋보기로 5초 동안 다시 볼 수 있어. 손가락으로 렌즈를 끌면 다른 곳도 보여!</span></figcaption></figure><figure><a href='019.jpg'><img loading='lazy' src='019.jpg' alt='대사를 넘기면 : 렌즈로 둘러봄 (둘레 띠가 가득)'></a><figcaption>대사를 넘기면 : 렌즈로 둘러봄 (둘레 띠가 가득)</figcaption></figure><figure><a href='020.jpg'><img loading='lazy' src='020.jpg' alt='남은 시간만큼 띠가 줄어듦 (마지막 1초는 코랄색으로 바뀜)'></a><figcaption>남은 시간만큼 띠가 줄어듦 (마지막 1초는 코랄색으로 바뀜)</figcaption></figure><figure><a href='021.jpg'><img loading='lazy' src='021.jpg' alt='돋보기 시범 끝 : 한 번만 더 빌려준다고 알려 줌'></a><figcaption>돋보기 시범 끝 : 한 번만 더 빌려준다고 알려 줌<span class='l'>이번은 공짜! 돋보기는 소풍 끝날 때까지 딱 한 번만 더 빌려줄게. 아껴 써!</span></figcaption></figure><figure><a href='022.jpg'><img loading='lazy' src='022.jpg' alt='그리기 시작 : 빈 쪽지'></a><figcaption>그리기 시작 : 빈 쪽지</figcaption></figure><figure><a href='023.jpg'><img loading='lazy' src='023.jpg' alt='톱니 : 소리 설정 (배경음 · 효과음, 여는 동안 멈춤)'></a><figcaption>톱니 : 소리 설정 (배경음 · 효과음, 여는 동안 멈춤)</figcaption></figure><figure><a href='024.jpg'><img loading='lazy' src='024.jpg' alt='향이 10초 아래로 남았을 때'></a><figcaption>향이 10초 아래로 남았을 때</figcaption></figure><figure><a href='025.jpg'><img loading='lazy' src='025.jpg' alt='돋보기 : 렌즈를 끌어 원본을 둘러봄 (게임 전체 1번을 씀)'></a><figcaption>돋보기 : 렌즈를 끌어 원본을 둘러봄 (게임 전체 1번을 씀)</figcaption></figure><figure><a href='026.jpg'><img loading='lazy' src='026.jpg' alt='돋보기를 다 쓰면 숫자가 사라지고 흐려짐'></a><figcaption>돋보기를 다 쓰면 숫자가 사라지고 흐려짐</figcaption></figure><figure><a href='027.jpg'><img loading='lazy' src='027.jpg' alt='그림을 그린 상태'></a><figcaption>그림을 그린 상태</figcaption></figure><figure><a href='028.jpg'><img loading='lazy' src='028.jpg' alt='건네기 : 쪽지와 간식'></a><figcaption>건네기 : 쪽지와 간식<span class='l'>도깨비야, 여기 쪽지랑 간식!</span></figcaption></figure><figure><a href='029.jpg'><img loading='lazy' src='029.jpg' alt='건네기 : 도깨비가 간식을 먹음'></a><figcaption>건네기 : 도깨비가 간식을 먹음<span class='l'>냠냠, 달달하다! 쪽지 좀 볼까…</span></figcaption></figure><figure><a href='030.jpg'><img loading='lazy' src='030.jpg' alt='건네기 : 도깨비가 쪽지를 읽음'></a><figcaption>건네기 : 도깨비가 쪽지를 읽음<span class='l'>음, 내 방망이구나. 좋아, 찾아올게!</span></figcaption></figure><figure><a href='031.jpg'><img loading='lazy' src='031.jpg' alt='판정 대기 : 도깨비가 찾으러 다님'></a><figcaption>판정 대기 : 도깨비가 찾으러 다님</figcaption></figure><figure><a href='032.jpg'><img loading='lazy' src='032.jpg' alt='전부 틀림 : 도깨비가 물건을 가져옴'></a><figcaption>전부 틀림 : 도깨비가 물건을 가져옴<span class='l'>이게 내 방망이라고? 내 방망이는 이렇게 안 생겼어!</span></figcaption></figure><figure><a href='033.jpg'><img loading='lazy' src='033.jpg' alt='전부 틀림 : 주인공의 반응'></a><figcaption>전부 틀림 : 주인공의 반응<span class='l'
