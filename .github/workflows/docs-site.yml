# 문서 사이트 : Docs 가 바뀐 푸시마다 웹 문서를 다시 만들어 gh-pages 의 docs 폴더에 올려요
#   → https://azlsh-web.github.io/FindDokkaebi/docs/
#   gh-pages 의 다른 파일(웹 게임 index.html, Build)은 건드리지 않아요.
#   기준 브랜치가 main 으로 바뀌면 아래 branches 를 main 으로 바꿔요.
name: 문서 사이트

on:
  push:
    branches: [feature/game-feel]
    paths:
      - "Docs/**"
      - "Tools/docs/make_docs_site.py"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 문서 가져오기
        uses: actions/checkout@v4

      - name: gh-pages 가져오기
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 문서 사이트 만들기
        run: |
          pip install markdown
          python Tools/docs/make_docs_site.py "$RUNNER_TEMP/site"

      - name: gh-pages 의 docs 폴더만 바꿔서 올리기
        run: |
          rm -rf pages/docs
          mkdir -p pages/docs
          cp -a "$RUNNER_TEMP/site/." pages/docs/
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "바뀐 문서가 없어요"
            exit 0
          fi
          git commit -m "문서 사이트 갱신: ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
