<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찾아라! 도깨비</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
/* 게임 화면 하나만 가운데. 세로 9:16 쪽지 */
:root { --wall: #f8f1e3; --ink: #4a2b16; --coral: #ed8d80; --muted: #7a604a; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--wall); color: var(--ink);
  font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  display: grid; place-items: center; box-sizing: border-box;
  padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px));
}
#stage {
  position: relative; width: min(100%, calc((100vh - 30px) * 9 / 16), 480px);
  aspect-ratio: 9 / 16; border: 3px solid var(--ink); border-radius: 20px; overflow: hidden; background: var(--wall);
}
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#cover { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 16px; text-align: center; background: var(--wall); }
#cover[hidden] { display: none; }
#cover h1 { margin: 0; font-size: 26px; }
#bar { width: 200px; max-width: 100%; height: 12px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; }
#fill { height: 100%; width: 0; background: var(--coral); }
#status { color: var(--muted); font-size: 14px; margin: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" tabindex="-1"></canvas>
  <div id="cover">
    <h1>찾아라! 도깨비</h1>
    <div id="bar"><div id="fill"></div></div>
    <p id="status">게임 불러오는 중… 0% (처음 한 번 약 25MB)</p>
  </div>
</div>
<script src="Build/WebGL.loader.js"></script>
<script>
// 페이지를 열면 바로 Unity 웹 빌드를 불러와요
var fill = document.getElementById('fill'), status = document.getElementById('status');
createUnityInstance(document.getElementById('game'), {
  dataUrl: 'Build/WebGL.data.unityweb', frameworkUrl: 'Build/WebGL.framework.js.unityweb', codeUrl: 'Build/WebGL.wasm.unityweb',
  companyName: 'Team09', productName: 'FindDokkaebi', productVersion: '0.1',
}, function (p) {
  var pct = Math.round(p * 100);
  fill.style.width = pct + '%';
  status.textContent = '게임 불러오는 중… ' + pct + '% (처음 한 번 약 25MB)';
}).then(function () {
  document.getElementById('cover').hidden = true;
  document.getElementById('game').focus();
}).catch(function (e) {
  status.textContent = '이 브라우저에서는 실행되지 않았어요. PC 크롬이나 엣지로 열어 주세요. (' + e + ')';
});
</script>
</body>
</html>
